# ============================================================
# SubBridge 默认配置
# 说明：
#   1. 所有参数均可通过环境变量覆盖（见 README「环境变量」一节）
#   2. 所有参数均可通过 Web 前台「服务配置」页修改，并持久化到 data/config.yaml
#   3. 禁止在代码中写死任何运行参数，一律从这里读取
# ============================================================

ui:
  # 前台请求超时（秒）：请求挂起/超时后界面显示"加载失败·点击重试"，不再永远"加载中"
  request_timeout_seconds: 20

server:
  # 监听地址
  host: "0.0.0.0"
  # 监听端口（PaaS 平台通常通过环境变量 PORT 覆盖）
  port: 8080
  # 是否信任反向代理传递的 X-Forwarded-* 头
  trust_proxy: false

fetcher:
  # 单个订阅抓取超时（秒）
  timeout_seconds: 15
  # 抓取失败重试次数
  retries: 2
  # 重试退避初始延时（毫秒），按 2^n 递增
  retry_base_ms: 300
  # 重试退避最大延时（毫秒）
  retry_max_ms: 2000
  # 请求 User-Agent
  user_agent: "SubBridge/1.0"
  # 单次抓取内容大小上限（字节），默认 10MB
  max_body_bytes: 10485760
  # 单个来源一次抓取最多入库的节点数（0=不限制），防止海量订阅打爆节点池
  max_per_source: 500
  # 并发抓取的订阅地址数量上限
  max_concurrency: 5
  # 上游转发代理，支持 http/https，例如 http://user:pass@host:port；留空表示直连
  upstream_proxy: ""
  # 从节点池挑选可用 http 代理节点作为抓取上游（"抓取外部节点的代理也从节点池出"）
  # 显式配置了 upstream_proxy 时不生效
  proxy_from_pool: true
  # 节点池无可用代理时，回退为"本机直连"拉取（默认 true）。
  # 关闭后，节点池无节点 / 无可用代理时将直接失败并记录错误，不再直连。
  pool_empty_fallback_direct: true
  # 池代理挑选时是否排除本机节点（source=localnode）。默认 true：本机节点出口=本机网络，
  # 抓取境外源时用它中转依然连不通，反而拖慢抓取；需要"本机节点自中继"时可关闭
  pool_proxy_skip_localnode: true
  # 节点池代理类型白名单（支持 http / https / socks4 / socks5 / ss / trojan / vless；
  # socks/ss/trojan/vless 通过本地协议桥转成 http 上游，vmess/ws/QUIC 暂不支持自动中转）
  proxy_pool_types:
    - "http"
    - "socks5"
    - "socks4"
    - "ss"
    - "trojan"
    - "vless"
  # 本地协议桥（把 socks/ss/trojan/vless 节点转成 http 上游）复用 TTL（秒），默认 300
  proxy_bridge_ttl_seconds: 300
  # 抓取前对候选代理做 TCP 快速测速（保证用"网速快的代理"中转抓取）
  proxy_tcp_probe: true
  # 代理 TCP 测速超时（毫秒），超过视为不可达
  proxy_tcp_probe_timeout_ms: 3000
  # 代理测速并发数
  proxy_tcp_probe_concurrency: 6
  # 代理延迟上限（毫秒），0=不限制；超过上限的代理不用于抓取
  proxy_max_latency_ms: 0
  # 抓取自定义请求头（JSON 对象），如 {"Authorization":"Bearer xxx","Cookie":"a=1"}
  # 可被请求参数 ?headers=<JSON> 临时覆盖；支持多种客户端订阅源鉴权
  headers: {}
  # SSRF 防护：禁止抓取内网/保留地址（127.0.0.1、10.x、172.16-31.x、192.168.x、169.254.x、::1、fc00::/7 等）
  block_private: true
  # 内网地址白名单（域名），命中则跳过 SSRF 拦截，例如 ["internal.example.com"]
  private_host_allowlist: []
  # 抓取公开订阅时，是否通过本机代理节点中转（自中继采集；需 localnode 的 HTTP 代理在运行，顺带验证本机节点可用）
  relay_through_localnode: false

converter:
  # 默认目标格式：clash / singbox / links / v2ray
  default_target: "clash"
  # 是否按 类型+服务器+端口 去重
  dedupe: true
  # 节点是否默认开启 udp
  udp: true
  # 节点名称是否追加来源备注（如 "节点名 [example.com]"，标明从哪个订阅抓取）
  append_source: true
  # 节点排序：name（名称升序）/ name_desc（名称降序）/ 留空保持原序
  sort: ""
  # 节点名称过滤（正则），留空不过滤
  include: ""
  exclude: ""
  # 节点名称重命名前后缀
  rename_prefix: ""
  rename_suffix: ""
  # 某个订阅抓取失败时是否跳过继续（false 则整体请求失败）
  skip_failed: true
  # Clash 模板文件（相对 templates/ 目录，可在前台编辑/新增）
  template_file: "clash.tmpl.yaml"
  # 规则模板文件（相对 templates/ 目录，可在前台编辑/新增）
  rules_file: "rules.tmpl.txt"
  # Clash 输出相关参数
  clash:
    # 手动选择策略组名称
    select_group_name: "PROXY"
    # 自动测速策略组名称
    auto_group_name: "AUTO"
    # 自动测速探测地址
    url_test_url: "http://www.gstatic.com/generate_204"
    # 自动测速间隔（秒）
    url_test_interval: 300
    # 是否对重名节点做名称唯一化（Clash 禁止重名 proxy，默认开启）
    unique_names: true

  # sing-box 输出参数
  singbox:
    # 是否对重名节点做 tag 唯一化（sing-box 要求 tag 唯一，默认开启）
    unique_tags: true

security:
  # 管理员令牌：完全访问（/convert、/sub、/api/*）
  api_token: ""
  # 普通用户令牌：仅可拉取订阅（/convert、/sub），无法修改配置
  # 注意：设置 user_token 时务必同时设置 api_token，否则无人具备管理权限
  user_token: ""
  # 账号密码登录（登录页 /api/login）：匹配成功返回对应角色令牌
  # 留空表示不启用该角色的账号登录，仍可用令牌方式访问
  admin_username: ""
  admin_password: ""
  user_username: ""
  user_password: ""

localnode:
  # 是否启用本机作为订阅节点（默认关闭，避免意外开放代理）
  enabled: false
  # 监听模式：standalone=独立端口监听（http_port/socks_port）；shared=端口复用，
  # HTTP 代理与 Web 页面/API 共用同一个端口（适合只有单个端口的部署如 Waifly），
  # 此时 http_port 仅作展示，实际端口为主服务端口，SOCKS5 仍独立监听
  mode: "standalone"
  # 节点服务监听地址（需要被外部客户端访问时设为 0.0.0.0）
  host: "0.0.0.0"
  # HTTP 代理端口；0 表示不启用
  http_port: 1080
  # SOCKS5 代理端口；0 表示不启用
  socks_port: 1081
  # 认证（强烈建议设置，避免开放代理被滥用）；留空表示无认证
  username: ""
  password: ""
  # 客户端可访问本机的地址（域名或公网 IP）；留空时依次尝试 CF 隧道域名、自动探测公网 IP
  public_address: ""
  # 对外端口：PaaS 平台（Render/Waifly 等）容器内端口与外网端口不一致时，
  # 用此端口注入订阅节点（如 443）；留空/0 则使用容器内监听端口
  public_port: 0
  # 对外是否 TLS：PaaS 平台 443 有平台 TLS 边缘（如 Render），填 true 时注入为
  # HTTPS 代理节点（type=http + tls + sni=public_address），客户端经 443 加密隧道访问
  public_tls: false
  # 是否自动探测公网 IP（需要本机可访问外网探测服务）
  auto_detect_public_ip: true
  # 公网 IP 探测服务地址
  public_ip_detect_url: "https://api.ipify.org"
  # 公网 IP 探测超时（毫秒）
  ip_probe_timeout_ms: 5000
  # IP 缓存时间（秒）
  ip_cache_seconds: 300
  # 是否将本机节点注入订阅转换结果
  inject_into_subscription:
  # 是否默认将本机节点加入节点池（true：启动/重启时自动同步入池，可从池统一输出；
  # false：仅 /sub 拉取时按需注入，不写入节点池）
  auto_join_pool: true
  # 注入节点的名称
  http_node_name: "本机-HTTP"
  socks_node_name: "本机-SOCKS5"

cf_tunnel:
  # 是否启用 Cloudflare Tunnel（本机无公网 IP 时，用 cloudflared 把节点映射为公网 HTTPS 地址）
  enabled: false
  # cloudflared 可执行文件路径（或仅命令名，需在 PATH 中）
  binary: "cloudflared"
  # 模式一：远程管理隧道令牌（填了就用 token 模式，hostname 在 CF 后台配置）
  token: ""
  # 模式二：命名隧道（填 hostname + tunnel_uuid + credentials_file）
  hostname: ""
  tunnel_uuid: ""
  credentials_file: ""
  # 隧道入口指向的本地服务；留空自动按 localnode.http_port 生成 http://127.0.0.1:<port>
  ingress_service: ""
  # 注入订阅时优先使用的公网主机（一般不填；填了则覆盖隧道自动获取的地址）
  public_hostname_override: ""

probe:
  # 是否默认启用可用性检测（/convert 与 /sub 可通过 probe=1/0 覆盖）
  enabled: false
  # 并发检测的节点数上限
  concurrency: 10
  # 单节点 TCP 连接超时（毫秒）
  timeout_ms: 3000
  # 上游探测代理（http/socks5）：配置后 TCP 探测改经代理 CONNECT 完成，
  # 适用于本机无法直连目标网络的环境；留空则直连探测（回退 fetcher.upstream_proxy）
  upstream_proxy: ''
  # 是否剔除不可达节点（false 则保留并在 probe 字段标注状态）
  drop_unreachable: true
  # 是否对 http/socks5 节点做真实下载测速（其余协议仅做 TCP 连通性检测）
  speed_test: false
  # 测速下载地址
  speed_test_url: "https://speed.cloudflare.com/__down?bytes=200000"
  # 测速采样字节数（收到该字节量即结束）
  speed_test_bytes: 200000
  # 是否把延迟追加到节点名称（如 "节点名 [120ms]"）
  append_latency: false

subscription:
  # 订阅链接协议：auto（默认，信任反代头 x-forwarded-proto，平台强制 HTTPS 时复制即为 https）| http | https
  url_scheme: auto
  # 本机订阅源（/sub 端点）默认合并的主订阅地址列表
  main_urls: []
  # 其他订阅链接（自动拉取入池，补充节点库；每行一条，格式：名称|URL）
  # 与主订阅的区别：extra_sources 只入池累积，是否输出由节点池/规则决定
  extra_sources: []
  # 主订阅实时抓取结果是否直接并入 /sub 输出（false 时仅作为节点池来源，不直接输出）
  merge_main_urls: true
  # /sub 拉取时主订阅池刷新方式：true=异步刷新（立即输出当前池，后台抓取，防客户端超时）；false=同步等抓取完成
  async_refresh: true
  # 是否并入节点池累积节点（每次抓取自动补充/更新、不自动删除）
  include_pool: true
  # /sub 默认目标格式
  default_target: "clash"
  # /sub 默认是否启用可用性检测（可通过 probe=1/0 覆盖）
  probe_by_default: true
  # /sub 响应缓存秒数（0 表示不缓存）
  cache_seconds: 60
  # /sub 默认订阅名称
  name: "SubBridge"
  # 自定义选取规则（从节点池取节点时应用，可用 /sub?rules= 或 /convert?rules= 覆盖）
  # 规则为 JSON/YAML 数组，逐条生效，示例：
  #   - { type: "latency", max_ms: 300 }
  #   - { type: "sort", key: "latency", order: "asc" }
  #   - { type: "limit", count: 20 }
  # 更多类型见 src/core/rules.js（include/exclude/type/country/source/latency/speed/sort/limit）
  rules: []

pool:
  # /sub 输出节点池节点时是否剔除检测不可达的节点（默认保留全部，不做自动删除）
  drop_unreachable: false
  # 新入库节点的默认启用状态（可在节点库手动开关；停用节点不参与订阅输出）
  default_enabled: true
  # /sub 输出是否包含已停用节点（也可用 ?include_disabled=1 临时覆盖）
  include_disabled: false
  # 质量门槛：根据延迟/速度/可用性/质量分等动态指标自动开关节点（测速完成后自动应用）
  # 默认关闭，避免误停用；开启后不合格节点自动停用、合格节点自动启用
  quality_enabled: false
  # 判定模式：all 全部门槛通过才算合格；any 任一门槛通过即算合格
  quality_mode: "all"
  # 未测节点（无探测数据）默认视为合格放行，避免刚入库就被停用
  quality_default_pass: true
  # 质量门槛列表（JSON/YAML 数组，每条可加 enabled:false 停用），示例：
  #   - { type: "alive" }
  #   - { type: "latency", max_ms: 500 }
  #   - { type: "speed", min_bps: 1000000 }
  #   - { type: "score", min_score: 60 }
  #   - { type: "name", exclude: "测试|过期" }
  quality_gates: []
  # 自动清理（自定义删除逻辑）：默认关闭（保留全部节点）；开启后按 cleanup_rules 自动删除
  cleanup_enabled: false
  # 一键「测速并自动过滤 / 删除不可用节点」的延迟上限（毫秒），超过视为不可用
  filter_max_latency_ms: 1000
  # 未测节点（无探测数据）是否视为可用并保留（默认保留，避免误删刚入库的节点）
  filter_keep_unprobed: true
  # 清理规则（JSON/YAML 数组，满足任一规则即删除；每条可加 enabled:false 停用），示例：
  #   - { type: "unreachable" }
  #   - { type: "stale", days: 7 }
  #   - { type: "no_probe", days: 3 }
  #   - { type: "latency", max_ms: 800 }
  #   - { type: "speed", min_bps: 100000 }
  #   - { type: "score", max_score: 30 }
  #   - { type: "name", match: "测试|过期" }
  #   - { type: "source", match: "example.com" }
  cleanup_rules: []

grab:
  # 网页抓取：从 HTML 页面递归发现订阅链接的最大深度（0 表示只解析页面本身）
  max_depth: 2
  # 网页中发现订阅链接后最多递归抓取的数量
  max_links: 20
  # 判定"订阅链接"的路径特征关键词（命中即尝试递归抓取）
  link_keywords: ["sub", "subscribe", "client", "api", "token", "node", "v2ray", "clash", "config"]
  # 自动采集：间隔（分钟），0=关闭；开启后定时抓取全部"启用且参与采集"的来源
  auto_interval_minutes: 0
  # 自动采集 cron 表达式（优先级高于间隔），如 "0 0 * * *"=每天 00:00；留空则用 auto_interval_minutes
  auto_cron: ""
  # 抓取（手动/自动/采集）完成后是否自动对本次入库节点测速
  auto_probe: false
  # auto_probe 开启时，测速后是否自动删除"已测且不可用"的节点（默认关闭=保留全部）
  auto_remove_unreachable: false

fetch_log:
  # 抓取日志最大保留条数（内存环形缓冲，超出自动丢弃最旧）
  capacity: 500

logging:
  # trace / debug / info / warn / error
  level: "info"

storage:
  # 存储驱动：file（默认，文件系统，零依赖）| sqlite（可选，需 npm install better-sqlite3）
  # 数据落库到 data/subbridge.sqlite；新增驱动只需在 src/store 注册并实现统一接口，
  # 页面即可切换；驱动变更需重启服务后生效
  driver: "file"

# ============ 内置模板（规则 / 质量门槛 / 清理规则 一键初始化） ============
# value 为可直接使用的规则数组；label / desc 用于前端展示。
# 前台可修改、可新增（保存后立即生效，无需重启）。
presets:
  # 订阅选取规则模板（/sub 与规则卡片「生成订阅链接」使用）
  rules:
    fast-stable:
      label: "快速稳定（延迟≤300ms 取前 20）"
      desc: "最常用：排除高延迟节点，按延迟升序取前 20 条。"
      value:
        - { type: "latency", max_ms: 300 }
        - { type: "sort", key: "latency", order: "asc" }
        - { type: "limit", count: 20 }
    all-latency:
      label: "全部按延迟排序"
      desc: "不限制数量，仅按延迟从低到高排列（未测节点排后）。"
      value:
        - { type: "sort", key: "latency", order: "asc" }
    by-speed:
      label: "高速优先（≥1MB/s 取前 30）"
      desc: "只看下载速度，按速度从高到低取前 30 条。"
      value:
        - { type: "speed", min_bps: 1000000 }
        - { type: "sort", key: "speed", order: "desc" }
        - { type: "limit", count: 30 }
    exclude-slow:
      label: "排除慢速（延迟≤800ms 且 ≥100KB/s）"
      desc: "宽松筛选：只排除明显不可用的节点。"
      value:
        - { type: "latency", max_ms: 800 }
        - { type: "speed", min_bps: 100000 }
    fast-us:
      label: "快速美国（US 前 10）"
      desc: "仅保留美国节点，延迟≤300ms，按延迟升序取前 10。"
      value:
        - { type: "country", value: ["US"] }
        - { type: "latency", max_ms: 300 }
        - { type: "sort", key: "latency", order: "asc" }
        - { type: "limit", count: 10 }
    fast-as:
      label: "快速亚洲（港/日/台/新 前 15）"
      desc: "仅保留香港/日本/台湾/新加坡节点，按延迟升序取前 15。"
      value:
        - { type: "country", value: ["HK", "JP", "TW", "SG"] }
        - { type: "sort", key: "latency", order: "asc" }
        - { type: "limit", count: 15 }
    type-vless:
      label: "仅 VLESS 快速（前 50）"
      desc: "只保留 VLESS 协议节点，延迟≤500ms 取前 50。"
      value:
        - { type: "type", value: ["vless"] }
        - { type: "latency", max_ms: 500 }
        - { type: "limit", count: 50 }
    no-test:
      label: "排除测试/过期（前 50）"
      desc: "按名称排除带测试/过期/免费字样的节点，按延迟升序取前 50。"
      value:
        - { type: "exclude", pattern: "测试|过期|免费" }
        - { type: "sort", key: "latency", order: "asc" }
        - { type: "limit", count: 50 }
    hk-tw:
      label: "港台专用（前 10）"
      desc: "仅保留香港/台湾节点，按延迟升序取前 10。"
      value:
        - { type: "country", value: ["HK", "TW"] }
        - { type: "sort", key: "latency", order: "asc" }
        - { type: "limit", count: 10 }

  # 质量门槛模板（按多指标自动开关节点）
  quality_gates:
    basic:
      label: "基础连通（alive + 延迟≤1000ms）"
      desc: "只要求节点可达、延迟在 1 秒内，适合节点较少的场景。"
      value:
        - { type: "alive" }
        - { type: "latency", max_ms: 1000 }
    standard:
      label: "标准门槛（延迟≤500ms 且 ≥1MB/s）"
      desc: "日常推荐：可用、延迟与速度均达标，质量分≥60。"
      value:
        - { type: "alive" }
        - { type: "latency", max_ms: 500 }
        - { type: "speed", min_bps: 1000000 }
        - { type: "score", min_score: 60 }
    strict:
      label: "严格门槛（延迟≤300ms 且 ≥5MB/s）"
      desc: "高质量要求：延迟低、速度快，质量分≥70。"
      value:
        - { type: "alive" }
        - { type: "latency", max_ms: 300 }
        - { type: "speed", min_bps: 5000000 }
        - { type: "score", min_score: 70 }
    relaxed:
      label: "宽松门槛（alive + 质量分≥40）"
      desc: "只要求节点可用，分数不低，尽量保留更多节点。"
      value:
        - { type: "alive" }
        - { type: "score", min_score: 40 }
    no-slow-name:
      label: "排除劣名（测试/过期/免费）"
      desc: "可用性达标 + 名称排除明显劣质节点，其余放行。"
      value:
        - { type: "alive" }
        - { type: "name", exclude: "测试|过期|免费" }

  # 自动清理模板（满足任一规则即删除）
  cleanup_rules:
    basic:
      label: "清理不可用节点"
      desc: "检测为不可达（probe.alive=false）的节点自动删除。"
      value:
        - { type: "unreachable" }
    no-probe:
      label: "清理不可用 + 7 天未测"
      desc: "不可达节点，以及入库超 7 天仍未测速的节点一并清理。"
      value:
        - { type: "unreachable" }
        - { type: "no_probe", days: 7 }
    stale:
      label: "清理 30 天未更新 + 不可用"
      desc: "超 30 天未更新的节点，或检测不可达的节点自动删除。"
      value:
        - { type: "stale", days: 30 }
        - { type: "unreachable" }
    slow:
      label: "清理慢速（>1000ms 或 <100KB/s）"
      desc: "延迟超过 1 秒，或速度低于 100KB/s 的节点自动删除。"
      value:
        - { type: "latency", max_ms: 1000 }
        - { type: "speed", min_bps: 100000 }
    expired-name:
      label: "清理名称含 测试/过期"
      desc: "按名称正则删除明显劣质/过期节点。"
      value:
        - { type: "name", match: "测试|过期|免费" }
    dead-score:
      label: "清理低质量分（≤30）"
      desc: "质量分低于 30 的节点自动删除（依赖测速数据）。"
      value:
        - { type: "score", max_score: 30 }
