scenarios:
  streaming:
    label: 影视模式（追剧 / 4K）
    emoji: 🎬
    desc: 看 Netflix / Disney+ / YouTube 4K 首选：只留高速节点，延迟低、跑满速，适合影视与流媒体。
    audience: 追剧党、4K 爱好者（默认推荐场景）
    rules:
    - type: speed
      min_bps: 5000000
    - type: latency
      max_ms: 500
    - type: sort
      key: speed
      order: desc
    - type: limit
      count: 20
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 800
    - type: speed
      min_bps: 2000000
    - type: score
      min_score: 60
    cleanup_rules:
    - type: unreachable
    - type: slow
      max_ms: 800
    - type: no_probe
      days: 3
    config_patch:
      converter:
        udp: true
        clash:
          url_test_url: https://www.google.com/generate_204
          url_test_interval: 180
      probe:
        speed_test: true
        speed_test_url: https://speed.cloudflare.com/__down?bytes=10000000
        speed_test_bytes: 10000000
  daily:
    label: 日常上网
    emoji: 🌐
    desc: 看网页、刷视频、聊微信都不卡的通用配置，省心均衡。
    audience: 大多数人首选
    rules:
    - type: latency
      max_ms: 800
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 30
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 1000
    - type: score
      min_score: 40
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 30
    config_patch:
      converter:
        udp: true
        sort: ''
        clash:
          url_test_interval: 300
  gaming:
    label: 游戏加速
    emoji: 🎮
    desc: 低延迟优先，减少跳 ping，适合联机对战。
    audience: 玩家
    rules:
    - type: latency
      max_ms: 150
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 15
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 300
    cleanup_rules:
    - type: latency
      max_ms: 500
    - type: unreachable
    config_patch:
      converter:
        udp: true
      probe:
        timeout_ms: 2000
  office:
    label: 办公远程
    emoji: 💼
    desc: 稳定优先：开会、传文档、访问公司内网不中断。
    audience: 远程办公
    rules:
    - type: latency
      max_ms: 500
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 25
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 800
    - type: score
      min_score: 50
    cleanup_rules:
    - type: unreachable
    - type: no_probe
      days: 7
    config_patch:
      converter:
        udp: true
  crossborder:
    label: 跨境电商
    emoji: 📦
    desc: 多区域节点切换，访问 Amazon / eBay / 速卖通等站点。
    audience: 跨境卖家
    rules:
    - type: country
      value:
      - US
      - HK
      - JP
      - SG
      - DE
      - UK
    - type: latency
      max_ms: 600
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 40
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 1000
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 30
    config_patch:
      converter:
        udp: false
  social:
    label: 自媒体运营
    emoji: 📱
    desc: 稳定访问 TikTok / Instagram / X，上传发布不失败。
    audience: 博主、运营
    rules:
    - type: country
      value:
      - US
      - JP
      - SG
      - HK
    - type: latency
      max_ms: 500
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 30
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 800
    - type: score
      min_score: 45
    cleanup_rules:
    - type: unreachable
    - type: slow
      max_ms: 1200
    config_patch:
      converter:
        udp: true
  student:
    label: 留学生
    emoji: 🎓
    desc: 兼顾海外访问与回国看视频，多区域线路齐全。
    audience: 留学生
    rules:
    - type: latency
      max_ms: 700
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 35
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 1000
    - type: score
      min_score: 40
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 20
    config_patch:
      converter:
        udp: true
  homeland:
    label: 回国加速
    emoji: 🇨🇳
    desc: 海外回国看剧听歌、用国内 App，优选回国线路。
    audience: 海外华人
    rules:
    - type: country
      value:
      - HK
      - TW
      - JP
      - SG
    - type: latency
      max_ms: 500
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 20
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 800
    cleanup_rules:
    - type: unreachable
    - type: slow
      max_ms: 1200
    config_patch:
      converter:
        udp: true
  academic:
    label: 学术科研
    emoji: 🔬
    desc: 稳定访问 Google Scholar / 论文库 / GitHub，隐私优先。
    audience: 科研人员、学生
    rules:
    - type: latency
      max_ms: 600
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 30
    quality_gates:
    - type: alive
    - type: score
      min_score: 50
    cleanup_rules:
    - type: unreachable
    - type: no_probe
      days: 14
    config_patch:
      converter:
        udp: true
  developer:
    label: 开发者调试
    emoji: 👨‍💻
    desc: 稳定访问 GitHub / 云厂商 API / Docker，低延迟不中断。
    audience: 程序员
    rules:
    - type: latency
      max_ms: 400
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 25
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 700
    cleanup_rules:
    - type: unreachable
    - type: stale
