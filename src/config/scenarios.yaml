    config_patch:
      converter:
        udp: true
  voice:
    label: 语音视频通话
    emoji: 📞
    desc: 低延迟低抖动，Teams / Zoom / 微信视频通话更稳。
    audience: 经常开会
    rules:
    - type: latency
      max_ms: 250
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 15
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 400
    cleanup_rules:
    - type: latency
      max_ms: 600
    - type: unreachable
    config_patch:
      converter:
        udp: true
      probe:
        timeout_ms: 2500
  download:
    label: 大文件下载
    emoji: ⬇️
    desc: 带宽优先：下载镜像、模型、大文件跑满速。
    audience: 下载党
    rules:
    - type: speed
      min_bps: 2000000
    - type: sort
      key: speed
      order: desc
    - type: limit
      count: 10
    quality_gates:
    - type: alive
    - type: speed
      min_bps: 1000000
    cleanup_rules:
    - type: unreachable
    - type: slow
      max_ms: 800
    config_patch:
      converter:
        udp: true
      probe:
        speed_test: true
  light:
    label: 轻量浏览
    emoji: 🌿
    desc: 只保留最快的几个节点，日常浏览够用、切换快。
    audience: 轻度用户
    rules:
    - type: latency
      max_ms: 400
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 8
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 600
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 15
    config_patch:
      converter:
        udp: false
  resilient:
    label: 高可用容灾
    emoji: 🛡️
    desc: 多线路自动切换，一条挂了自动换另一条，尽量不断网。
    audience: 稳定性要求高
    rules:
    - type: latency
      max_ms: 800
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 50
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 1200
    - type: score
      min_score: 35
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 10
    config_patch:
      converter:
        udp: true
        clash:
          url_test_interval: 120
  privacy:
    label: 隐私保护
    emoji: 🔒
    desc: 全节点 TLS + 加密协议优先，保护上网隐私。
    audience: 重视隐私
    rules:
    - type: type
      value:
      - vless
      - trojan
      - hysteria2
    - type: latency
      max_ms: 600
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 20
    quality_gates:
    - type: alive
    - type: score
      min_score: 55
    cleanup_rules:
    - type: unreachable
    - type: no_probe
      days: 10
    config_patch:
      converter:
        udp: true
  live:
    label: 直播推流
    emoji: 📡
    desc: 低延迟上行优先，适合直播与视频号推流。
    audience: 主播、创作者
    rules:
    - type: latency
      max_ms: 200
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 12
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 350
    cleanup_rules:
    - type: latency
      max_ms: 500
    - type: unreachable
    config_patch:
      converter:
        udp: true
      probe:
        timeout_ms: 2000
  crawler:
    label: 数据采集
    emoji: 🤖
    desc: 多节点轮换采集，避免单一 IP 被限，抓取任务更稳。
    audience: 爬虫、数据分析
    rules:
    - type: latency
      max_ms: 1000
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 60
    quality_gates:
    - type: alive
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 7
    config_patch:
      converter:
        udp: false
      probe:
        timeout_ms: 5000
  mobile:
    label: 移动端省电
    emoji: 📲
    desc: 少而精的节点列表，手机端切换快、耗电少。
    audience: 手机用户
    rules:
    - type: latency
      max_ms: 500
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 10
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 800
    cleanup_rules:
    - type: unreachable
    - type: stale
      days: 20
    config_patch:
      converter:
        udp: true
        sort: latency
  enterprise:
    label: 企业组网
    emoji: 🏢
    desc: 稳定线路 + 多出口，办公网络与分公司互通更可靠。
    audience: 企业 IT
    rules:
    - type: latency
      max_ms: 600
    - type: sort
      key: latency
      order: asc
    - type: limit
      count: 40
    quality_gates:
    - type: alive
    - type: latency
      max_ms: 900
    - type: score
      min_score: 50
    cleanup_rules:
    - type: unreachable
    - type: no_probe
      days: 5
    config_patch:
      converter:
        udp: true
        clash:
          url_test_interval: 180
  power:
    label: 极客折腾
    emoji: ⚡
    desc: 全功能开放：不限制数量，全部节点按延迟排序，自由挑选。
    audience: 进阶用户
    rules:
    - type: sort
      key: latency
      order: asc
    quality_gates:
    - type: alive
    cleanup_rules:
    - type: unreachable
    config_patch:
      converter:
        udp: true
        sort: ''
